<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GroundLoop — demo</title>
  <meta name="description" content="GroundLoop demo: free resident app (food scraps → compost) + aggregated partner dashboard. Sample mode, no login." />
  <!-- Leaflet (OpenStreetMap). Free, no API key. Only external dependency. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand" data-i18n="app.name">GroundLoop</div>
      <div class="tagline" data-i18n="app.tagline">Follow your food scraps back to the soil.</div>
    </div>
    <div class="topbar-controls">
      <label class="langtoggle">
        <span class="globe" aria-hidden="true">🌐</span>
        <select id="topLang" aria-label="Language"></select>
      </label>
      <div class="switch" id="viewSwitch">
        <button data-view="resident" class="active" data-i18n="nav.resident">Resident app</button>
        <button data-view="partner" data-i18n="nav.partner">Partner dashboard</button>
      </div>
    </div>
  </header>

  <main class="stage">
    <!-- Resident phone -->
    <section id="residentView" class="phone">
      <div class="appbar">
        <span class="mark" id="appMark">🍌</span>
        <span class="title" data-i18n="app.name">GroundLoop</span>
      </div>
      <div class="screen" id="screen"><!-- rendered by app.js --></div>
      <nav class="tabbar" id="tabbar"><!-- rendered by app.js --></nav>
    </section>

    <!-- Partner dashboard -->
    <section id="partnerView" class="dash" style="display:none"><!-- rendered by app.js --></section>
  </main>

  <script type="module" src="./app.js"></script>
  <noscript>This demo needs JavaScript. It runs entirely in your browser — no login, no server.</noscript>
</body>
</html>
